# Include inside your existing HTTPS server block.
# This file does not replace the site's configuration.
location = /telegram-personal-mcp {
    return 308 /telegram-personal-mcp/;
}

location ^~ /telegram-personal-mcp/ {
    client_max_body_size 201m;
    proxy_pass http://127.0.0.1:8899/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;

    # File download tickets and OAuth codes must not be copied into access logs.
    access_log off;
}

# RFC 8414 discovery for an authorization issuer with a path prefix.
location = /.well-known/oauth-authorization-server/telegram-personal-mcp {
    proxy_pass http://127.0.0.1:8899/.well-known/oauth-authorization-server;
    proxy_set_header Host $host;
    access_log off;
}

# RFC 9728 discovery for the MCP resource path.
location = /.well-known/oauth-protected-resource/telegram-personal-mcp/mcp {
    proxy_pass http://127.0.0.1:8899/.well-known/oauth-protected-resource;
    proxy_set_header Host $host;
    access_log off;
}
