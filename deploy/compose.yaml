name: telegram-personal-mcp

services:
  telegram-mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    user: "${TG_RUN_UID:-10001}:${TG_RUN_GID:-10001}"
    # Native VPS IPv6 is required for the reachable Telegram DC endpoint.
    # HTTP still binds only to loopback and is exposed through Nginx OAuth.
    network_mode: host
    environment:
      MCP_HOST: "127.0.0.1"
      MCP_PORT: "8899"
      TG_PUBLIC_URL: "${TG_PUBLIC_URL:?Set the public HTTPS origin in deploy/.env}"
      TG_OWNER_CONFIG: "/data/auth.json"
      TG_AUTH_DB: "/data/auth.sqlite"
      TG_CREDENTIALS_FILE: "/run/secrets/telegram.json"
      TG_DATA_DIR: "/data"
      TG_ALLOW_SEND: "${TG_ALLOW_SEND:-false}"
      TG_WHISPER_MODEL: "/data/models/whisper-small"
    volumes:
      - type: bind
        source: "${TG_DATA_PATH:-/opt/telegram-personal-mcp/data}"
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: "${TG_CREDENTIALS_PATH:-/opt/telegram-personal-mcp/secrets/telegram.json}"
        target: /run/secrets/telegram.json
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=256m,mode=1777"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8899/healthz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
